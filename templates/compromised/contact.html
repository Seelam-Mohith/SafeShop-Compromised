{% extends "base.html" %}
{% block title %}Contact - ShopSafe Lab{% endblock %}
{% block content %}
<section class="section">
    <h1 class="section-title">Contact Us</h1>
    <p style="max-width: 800px; margin-bottom: 1rem; color: #64748b;">
        Demonstration form only. Nothing is submitted or stored, and no
        credentials are collected.
    </p>
    <form class="form" onsubmit="event.preventDefault(); alert('Thank you. This is a demonstration contact form.');">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" required></textarea>
        </div>
        <button type="submit" class="btn-sm btn-primary">Send Message</button>
    </form>
</section>
{% endblock %}
